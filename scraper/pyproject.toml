[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "priceiq-scraper"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.17",
    "groq>=0.9.0",
    "pydantic-settings>=2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
