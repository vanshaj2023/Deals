name: PriceIQ Rotating Scraper Tick

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [scrape-queue]

jobs:
  scrape:
    name: Scraper Runner ${{ matrix.index }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        index: [0, 1, 2, 3, 4]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scraper/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir ./scraper

      - name: Execute Partition Scrape
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$SCRAPE_SECRET" ]; then
            echo "Error: BACKEND_URL or SCRAPE_SECRET is not set in repository secrets."
            echo "Please configure BACKEND_URL and SCRAPE_SECRET in GitHub Settings > Secrets > Actions."
            exit 1
          fi
          if [ -z "$SCRAPER_API_KEY" ]; then
            echo "Warning: SCRAPER_API_KEY not set. Requests will hit target sites directly from GH runner IPs and likely get CAPTCHA'd."
          fi
          python scraper/cli.py --index ${{ matrix.index }} --total 5 --backend-url "$BACKEND_URL" --secret "$SCRAPE_SECRET"
